# This game's descriptor: what a server runs when it installs this repository's pack. It
# travels inside the pack; content_id, version and kind are stamped by the installer.
#
# Paths are relative to the pack's mount point, which is also this repository's root.
# Not yet in dot-server-deploy's content/ (2026-10-06): this game has not been published.

content_id: gamemann/mg-dangerous-delivery
version: 0.0.0
kind: pack

name: Dangerous Delivery
max_players: 16

scene: scenes/dd_server.tscn
client_scene: game/dd.tscn
module: game/dd_module.gd

cvars:
  dd_bots: "2"

# This game's maps are small documents the server sends each client, so a host fetches the
# map packs its server owner names BEFORE the game loads (into the server-only packs)
# rather than on a map change: nobody is admitted to a server playing only the built-in map.
metadata:
  maps_delivery: server
